version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: opcp-internal-rag-postgres-${USER_ID}-${POSTGRES_PORT}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      # TLS configuration (Requirement 15.2)
      - ./certs:/var/lib/postgresql/certs:ro
      - ./database/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./database/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_user} -d ${POSTGRES_DB:-rag_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  redis:
    image: redis:7-alpine
    container_name: opcp-internal-rag-redis-${USER_ID}-${REDIS_PORT}
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network
    volumes:
      - redis_data:/data

  embedding-service:
    build:
      context: .
      dockerfile: services/embedding/Dockerfile
    container_name: opcp-internal-rag-embedding-${USER_ID}-${EMBEDDING_PORT}
    environment:
      MODEL_NAME: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      DEVICE: ${DEVICE:-cpu}
      MODEL_CACHE_DIR: /root/.cache/huggingface
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - model_cache:/root/.cache/huggingface
    ports:
      - "${EMBEDDING_PORT:-8001}:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rag-network

  llm-service:
    build:
      context: .
      dockerfile: services/llm/Dockerfile
    container_name: opcp-internal-rag-llm-${USER_ID}-${LLM_PORT}
    environment:
      MODEL_NAME: ${LLM_MODEL:-mistralai/Mistral-7B-Instruct-v0.2}
      DEVICE: ${DEVICE:-cpu}
      MODEL_CACHE_DIR: /root/.cache/huggingface
      MAX_TOKENS: ${MAX_TOKENS:-512}
      TEMPERATURE: ${TEMPERATURE:-0.7}
    volumes:
      - model_cache:/root/.cache/huggingface
    ports:
      - "${LLM_PORT:-8002}:8000"
    networks:
      - rag-network

  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    container_name: opcp-internal-rag-ingestion-${USER_ID}-${INGESTION_PORT}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-rag_db}
      DB_USER: ${POSTGRES_USER:-rag_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
      DOCS_PATH: /docs
      WATCH_INTERVAL: ${WATCH_INTERVAL:-10}
    volumes:
      - ./docs:/docs:ro
      - ./services/shared:/app/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
      embedding-service:
        condition: service_started
    networks:
      - rag-network

  api-backend:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: opcp-internal-rag-api-${USER_ID}-${API_PORT}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-rag_db}
      DB_USER: ${POSTGRES_USER:-rag_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      # Database SSL configuration (Requirement 15.2)
      DB_SSL_MODE: ${DB_SSL_MODE:-prefer}
      DB_SSL_CERT: ${DB_SSL_CERT:-}
      DB_SSL_KEY: ${DB_SSL_KEY:-}
      DB_SSL_ROOT_CERT: ${DB_SSL_ROOT_CERT:-}
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
      LLM_SERVICE_URL: http://llm-service:8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key}
      RATE_LIMIT_ANONYMOUS: ${RATE_LIMIT_ANONYMOUS:-100}
      RATE_LIMIT_AUTHENTICATED: ${RATE_LIMIT_AUTHENTICATED:-1000}
      MAX_PROMPT_TOKENS: ${MAX_PROMPT_TOKENS:-4096}
      TOP_K: ${TOP_K:-5}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.7}
      # TLS configuration (Requirement 15.2)
      ENABLE_TLS: ${ENABLE_TLS:-false}
      SSL_KEYFILE: ${SSL_KEYFILE:-/app/certs/api-key.pem}
      SSL_CERTFILE: ${SSL_CERTFILE:-/app/certs/api-cert.pem}
      # Swautomorph specific variables
      HTTP_PORT: ${HTTP_PORT:-8080}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    volumes:
      - ./services/shared:/app/shared:ro
      # Mount certificates for TLS (Requirement 15.2)
      - ./certs:/app/certs:ro
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embedding-service:
        condition: service_started
      llm-service:
        condition: service_started
    networks:
      - rag-network

  web-ui:
    build:
      context: ./services/web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${API_URL:-http://localhost:8080}
    container_name: opcp-internal-rag-web-${USER_ID}-${WEB_PORT}
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api-backend
    networks:
      - rag-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  model_cache:
    driver: local

networks:
  rag-network:
    driver: bridge