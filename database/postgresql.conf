# PostgreSQL configuration for TLS support
# This file configures SSL/TLS encryption for PostgreSQL connections

# Enable SSL/TLS (set to 'on' after generating certificates with scripts/generate-certs.sh)
ssl = off
ssl_cert_file = '/var/lib/postgresql/certs/postgres-cert.pem'
ssl_key_file = '/var/lib/postgresql/certs/postgres-key.pem'

# Require TLS 1.3 minimum
ssl_min_protocol_version = 'TLSv1.3'

# Strong cipher suites
ssl_ciphers = 'HIGH:!aNULL:!MD5:!3DES'
ssl_prefer_server_ciphers = on

# Connection settings
listen_addresses = '*'
max_connections = 100

# Memory settings
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 16MB
maintenance_work_mem = 128MB

# Write-ahead log
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB

# Query tuning
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_line_prefix = '%m [%p] %u@%d '
log_timezone = 'UTC'

# Locale
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
